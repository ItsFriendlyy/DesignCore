name: DesignCore
version: '${project.version}'
main: com.itsfriendly.designcore.DesignCore
api-version: '1.20'
author: ItsFriendly
description: Complete chat formatting, nametags, groups, friends, and PM system.
softdepend: [PlaceholderAPI, LuckPerms, voicechat]

commands:
  msg:
    description: Send a private direct message to a player.
    aliases: [tell, w]
    permission: designcore.msg
    permission-message: §cYou do not have permission to send private messages!
  reply:
    description: Reply to the last received direct message.
    aliases: [r]
    permission: designcore.msg
    permission-message: §cYou do not have permission to send private messages!
  design:
    description: Main administrative command for group and prefix configuration.
    permission: designcore.admin
  mutechat:
    description: Toggles global public chat.
    permission: designcore.mutechat
  friend:
    description: Manage friend requests and list friends.
    aliases: [f]
  unfriend:
    description: Remove a friend.
  pmsettings:
    description: Open GUI settings for direct messages and mutes.
  spym:
    description: Toggle staff spy to monitor private direct messages.
    permission: designcore.spym

permissions:
  designcore.msg:
    description: Allows sending and replying to private direct messages.
    default: true

  designcore.msg.bypass:
    description: Bypass recipient privacy settings (Friends-only or No-one).
    default: op

  designcore.*:
    description: Gives access to all DesignCore administrative features.
    default: op
    children:
      designcore.admin: true
      designcore.mutechat: true
      designcore.mutechat.bypass: true
      designcore.spym: true
      designcore.colorchat: true