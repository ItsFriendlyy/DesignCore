name: DesignCore
version: '${project.version}'
main: com.itsfriendly.designcore.DesignCore
api-version: '1.20'
author: ItsFriendly
description: Complete chat formatting, nametags, groups, friends, and PM system[cite: 1, 2].

commands:
  design:
    description: Main administrative command for group and prefix configuration[cite: 1].
    permission: designcore.admin
  mutechat:
    description: Toggles global public chat[cite: 1].
    permission: designcore.mutechat
  msg:
    description: Send a private direct message to a player[cite: 1].
    aliases: [tell, w]
  reply:
    description: Reply to the last received direct message[cite: 1].
    aliases: [r]
  friend:
    description: Manage friend requests and list friends[cite: 1].
    aliases: [f]
  pmsettings:
    description: Open GUI settings for direct messages and mutes[cite: 1].
  spym:
    description: Toggle staff spy to monitor private direct messages[cite: 1].
    permission: designcore.spym

permissions:
  designcore.*:
    description: Gives access to all DesignCore administrative features[cite: 2].
    default: op
    children:
      designcore.admin: true
      designcore.mutechat: true
      designcore.mutechat.bypass: true
      designcore.spym: true
  designcore.admin:
    description: Manage prefix and suffix groups[cite: 1, 2].
    default: op
  designcore.mutechat:
    description: Mute public chat[cite: 1, 2].
    default: op
  designcore.mutechat.bypass:
    description: Bypass mutechat restrictions[cite: 1].
    default: op
  designcore.spym:
    description: Spy on player private messages[cite: 1, 2].
    default: op